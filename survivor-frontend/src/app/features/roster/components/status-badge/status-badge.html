@if (status() === 'WINNER') {
<span class="badge badge-winner">
    <svg width="14" height="14" viewBox="0 0 24 24">
    <rect x="10.3" y="12" width="3.4" height="10" rx="1" fill="#8a6d4a"/>
    <path fill="#6b5236" d="M9.5 12 8.7 8.3a1 1 0 0 1 1-1.2h4.6a1 1 0 0 1 1 1.2L14.5 12z"/>
    <path fill="#ffc23c" d="M12 1.5c-1.6 2.4-3 3.6-3 6a3 3 0 0 0 6 0c0-.9-.2-1.6-.5-2.2.15.5.15 1-.05 1.4-.4-2-1.3-3.3-2.45-5.2z"/>
    <path fill="#ff6b5b" d="M12 4.2c-.9 1.5-1.7 2.3-1.7 3.7a1.7 1.7 0 0 0 3.4 0c0-1.4-.8-2.2-1.7-3.7z"/>
    </svg>
    Sole Survivor
</span>
} @else if (!status()) {
<span class="badge badge-winner">
    <svg width="14" height="14" viewBox="0 0 24 24">
    <rect x="10.3" y="12" width="3.4" height="10" rx="1" fill="#8a6d4a"/>
    <path fill="#6b5236" d="M9.5 12 8.7 8.3a1 1 0 0 1 1-1.2h4.6a1 1 0 0 1 1 1.2L14.5 12z"/>
    <path fill="#ffc23c" d="M12 1.5c-1.6 2.4-3 3.6-3 6a3 3 0 0 0 6 0c0-.9-.2-1.6-.5-2.2.15.5.15 1-.05 1.4-.4-2-1.3-3.3-2.45-5.2z"/>
    <path fill="#ff6b5b" d="M12 4.2c-.9 1.5-1.7 2.3-1.7 3.7a1.7 1.7 0 0 0 3.4 0c0-1.4-.8-2.2-1.7-3.7z"/>
    </svg>
    Active
</span>
} @else {
<span class="badge">
    <svg width="14" height="14" viewBox="0 0 24 24">
    <rect x="10.3" y="12" width="3.4" height="10" rx="1" fill="#8a6d4a"/>
    <path fill="#5c5348" d="M9.5 12 8.7 8.3a1 1 0 0 1 1-1.2h4.6a1 1 0 0 1 1 1.2L14.5 12z"/>
    <path fill="none" stroke="#b7ac9d" stroke-width="1.3" stroke-linecap="round" d="M10.5 5.5c.6.7.6 1.3.1 1.9M13 4.8c.6.9.5 1.6-.1 2.3"/>
    </svg>

    @if (status() === 'RUNNER_UP') {
    <span class="badge-runner-up">2nd Place</span>
    } @else if (status() === 'THIRD_PLACE') {
    <span class="badge-third-place">3rd Place</span>
    } @else if (status() === 'JURY') {
    <span class="badge-jury">Jury · {{ placementSummary() }}</span>
    } @else {
    <span class="badge-pre-jury">Out · {{ placementSummary() }}</span>
    }
</span>
}
